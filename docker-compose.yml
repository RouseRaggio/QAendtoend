services:
  postgres:
    image: postgres:16-alpine
    container_name: testflow-postgres
    restart: always
    environment:
      POSTGRES_USER: testflow
      POSTGRES_PASSWORD: testflowpassword
      POSTGRES_DB: testflowdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: testflow-backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://testflow:testflowpassword@postgres:5432/testflowdb
      - SECRET_KEY=super_production_secret_key_testflow_2026
      - AI_PROVIDER=mock
      - JIRA_BASE_URL=https://gestadoc.atlassian.net
      - JIRA_ENABLED=true
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests
      - backend_uploads:/app/uploads
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: testflow-frontend
    restart: always
    ports:
      - "3001:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_uploads:
